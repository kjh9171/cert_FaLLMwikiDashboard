version: '3.8'

services:
  # 1. Database (PostgreSQL 16 + pgvector) - Safe Port 5435 (Avoids 5432, 5433, 15432)
  family-db:
    image: pgvector/pgvector:pg16
    container_name: family_db
    restart: always
    environment:
      POSTGRES_DB: family_wiki_db
      POSTGRES_USER: family_admin
      POSTGRES_PASSWORD: super_secure_family_password_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5435:5432"

  # 2. Redis Message Broker & Cache - Safe Port 6385 (Avoids 6379, 6380, 16379)
  family-redis:
    image: redis:7.2-alpine
    container_name: family_redis
    restart: always
    ports:
      - "127.0.0.1:6385:6379"

  # 3. Local LLM Service (Ollama) - Safe Port 11438 (Avoids 11434, 11435)
  family-ollama:
    image: ollama/ollama:latest
    container_name: family_ollama
    restart: always
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11438:11434"

  # 4. FastAPI Core & OCR Backend - Safe Port 8088 (Avoids 8000, 8080, 8081, 8090)
  family-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://family_admin:super_secure_family_password_2026@family-db:5432/family_wiki_db
      REDIS_URL: redis://family-redis:6379/0
      OLLAMA_API_BASE: http://family-ollama:11434
    depends_on:
      - family-db
      - family-redis
      - family-ollama
    ports:
      - "8088:8000"

  # 5. Frontend Dashboard Web - Safe Port 8085 (Avoids 80, 8080, 8081, 8090)
  family-web:
    image: nginx:alpine
    container_name: family_web
    restart: always
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    ports:
      - "8085:80"
    depends_on:
      - family-backend

volumes:
  pgdata:
  ollamadata:
