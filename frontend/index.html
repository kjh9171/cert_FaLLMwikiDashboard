<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가족 LLM WIKI 대시보드 - 가족 구성원 선택</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <span class="brand-title">🏡 가족 LLM WIKI 대시보드</span>
      </div>
      <span id="backend-status" class="backend-status bg-amber-100 text-amber-800">연결 중...</span>
    </div>
  </div>
</header>

<main class="app-main fade-in">
  <!-- 사용자 등록 섹션 (항상 노출) -->
  <section class="card" style="margin-bottom:1.5rem;">
    <div class="card-title">👤 가족 구성원 등록</div>
    <p style="color:#718096; font-size:0.9rem; margin-bottom:1rem;">
      가족 구성원을 먼저 등록해 주세요. 등록 후 이름을 선택하면 해당 사용자의 일정 · 할일 · 가계부를 관리할 수 있습니다.
    </p>
    <form id="user-form" onsubmit="handleUserForm(event)" style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr auto auto; gap:0.75rem; align-items:end;">
      <input type="text" id="u-id" class="form-input" placeholder="사용자 ID (예: usr_jihoon_01)" required>
      <input type="text" id="u-name" class="form-input" placeholder="이름 (예: 지훈)" required>
      <select id="u-role" class="form-input">
        <option value="ADMIN">관리자</option>
        <option value="MEMBER">가족구성원</option>
        <option value="CHILD">자녀</option>
      </select>
      <input type="text" id="u-avatar" class="form-input" maxlength="2" placeholder="이니셜">
      <select id="u-color" class="form-input">
        <option value="#4299E1">파란색</option>
        <option value="#48BB78">초록색</option>
        <option value="#F687B3">분홍색</option>
        <option value="#ECC94B">노란색</option>
      </select>
      <button type="submit" class="btn-add" style="width:100%;">등록하기</button>
    </form>
  </section>

  <!-- 등록된 사용자 목록 -->
  <section class="card">
    <div class="card-title">📋 등록된 가족 구성원</div>
    <div id="user-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:1rem;">
      <!-- JS로 동적 생성 -->
    </div>
    <div id="no-users" class="empty-state" style="margin-top:2rem;">
      등록된 가족 구성원이 없습니다. 위 폼으로 첫 사용자를 추가해 주세요.
    </div>
  </section>
</main>

<script src="../assets/js/api.js"></script>
<script>
async function init() {
  await checkBackend();
  await loadUsers();
}

async function loadUsers() {
  try {
    const users = await api('/users');
    const list = document.getElementById('user-list');
    const empty = document.getElementById('no-users');
    list.innerHTML = '';
    if (users.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    users.forEach(u => {
      const card = document.createElement('div');
      card.className = 'card fade-in';
      card.style.cursor = 'pointer';
      card.onclick = () => {
        localStorage.setItem('selectedUserId', u.user_id);
        location.href = 'pages/dashboard.html';
      };
      card.innerHTML = `
        <div class="user-card">
          <div class="user-avatar" style="background:${u.color_code || '#4299E1'}">${u.avatar_initial || '?'}</div>
          <div>
            <div class="list-item-title">${u.name}</div>
            <div class="list-item-meta">${u.role} · ${u.user_id}</div>
          </div>
        </div>
        <div style="text-align:center; margin-top:0.5rem;">
          <button class="btn-primary" style="width:100%; padding:0.5rem; font-size:0.8rem;" onclick="event.stopPropagation(); selectUser('${u.user_id}')">선택하여 대시보드 이동</button>
        </div>
      `;
      list.appendChild(card);
    });
  } catch (e) {
    console.warn('loadUsers failed', e);
  }
}

async function handleUserForm(e) {
  e.preventDefault();
  const payload = {
    user_id: document.getElementById('u-id').value.trim(),
    name: document.getElementById('u-name').value.trim(),
    role: document.getElementById('u-role').value,
    color_code: document.getElementById('u-color').value,
    avatar_initial: document.getElementById('u-avatar').value.trim() || '?'
  };
  if (!payload.user_id || !payload.name) return alert('사용자 ID와 이름을 입력하세요.');
  try {
    await createUser(payload);
    document.getElementById('user-form').reset();
    await loadUsers();
    alert('사용자가 등록되었습니다. 이름을 클릭하여 대시보드로 이동하세요.');
  } catch (err) {
    alert('등록 실패: ' + err.message);
  }
}

async function selectUser(userId) {
  localStorage.setItem('selectedUserId', userId);
  location.href = 'pages/dashboard.html';
}

init();
</script>
</body>
</html>
